# Configuración del panel de administración (Decap CMS)
# Se abre en https://vipleconsultores.com/admin/

backend:
  name: github
  repo: gvillavicenciob/viple-web
  branch: main
  commit_messages:
    create: "Crear {{collection}}: {{slug}}"
    update: "Editar {{collection}}: {{slug}}"
    delete: "Borrar {{collection}}: {{slug}}"
    uploadMedia: "Subir imagen: {{path}}"
    deleteMedia: "Borrar imagen: {{path}}"
  # Al publicar desde el flujo editorial, cada cambio entra a main como un solo commit
  squash_merges: true

# Flujo editorial: lo que guardas en el panel NO se publica. Cada entrada crea una rama y un
# pull request en GitHub, Netlify genera una vista previa gratuita y solo al pulsar «Publicar»
# el cambio pasa a main (un despliegue a producción).
publish_mode: editorial_workflow

locale: es

# Nombres de archivo y direcciones web sin tildes ni caracteres especiales
slug:
  encoding: ascii
  clean_accents: true

# Permite probar el panel en tu computadora (npx decap-server). No afecta al sitio publicado.
local_backend: true
site_url: https://vipleconsultores.com
display_url: https://vipleconsultores.com
logo_url: /assets/img/logo-cuadrado.png

# Dónde se guardan las imágenes que subas desde el panel
media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  # ---------------- SERVICIOS ----------------
  # Nombres y descripciones breves que se muestran en el menú, la portada y /servicios/.
  - name: servicios
    label: Nuestros servicios
    delete: false
    editor:
      preview: false
    files:
      - label: Listado de servicios
        name: listado
        file: content/servicios.json
        fields:
          - label: Servicios
            name: servicios
            widget: list
            allow_add: false
            summary: "{{fields.name}}"
            hint: Cambia nombres o descripciones (las preguntas se editan en «¿Tienes preguntas?»). No agregues ni quites servicios desde aquí (cada uno tiene su propia página).
            fields:
              - { label: Dirección de la página (no cambiar), name: slug, widget: hidden }
              - { label: Nombre, name: name, widget: string, hint: "Título completo: se usa en la página del servicio, la portada y /servicios/." }
              - { label: Nombre corto para el menú, name: menu, widget: string, required: false, hint: "Opcional. Si lo dejas vacío, el menú desplegable usa el nombre completo." }
              - { label: Nombre corto como categoría de presentaciones, name: categoria_corta, widget: string, required: false, hint: "Opcional. Etiqueta y filtro en Presentaciones especiales (p. ej. «Asociaciones»). Si lo dejas vacío, se usa el nombre completo." }
              - { label: Descripción breve, name: summary, widget: text }

  # ---------------- ¿TIENES PREGUNTAS? ----------------
  # Fuente única de las preguntas: content/preguntas/<slug>.json.
  # Se usan en /preguntas/ (índice por servicio), /preguntas/<slug>/ (respuesta), la portada (destacadas)
  # y «Preguntas relacionadas» de cada servicio. Solo se muestran las que tienen «Publicada» marcada
  # y están completas (respuesta, título SEO, descripción SEO y fecha de actualización).
  - name: preguntas
    label: ¿Tienes preguntas?
    label_singular: Pregunta
    description: "Preguntas y respuestas de «¿Tienes preguntas?» (/preguntas/). Una pregunta solo aparece en la web si marcas «Publicada» y completas la respuesta, el título SEO, la descripción SEO y la fecha de actualización. Para ver cómo queda sin publicarla: márcala como publicada, pulsa Guardar y abre la vista previa; recién llega a la web con «Publicar ahora»."
    folder: content/preguntas
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: pregunta
    slug: "{{fields.slug}}"
    preview_path: "preguntas/{{slug}}"
    summary: "{{pregunta}} · {{servicio_asociado}}"
    sortable_fields: [pregunta, fecha_actualizacion, orden]
    view_filters:
      - label: Publicadas
        field: publicada
        pattern: true
      - label: Borradores (no publicadas)
        field: publicada
        pattern: false
      - label: Destacadas en la portada
        field: destacada
        pattern: true
    view_groups:
      - label: Servicio
        field: servicio_asociado
    fields:
      - label: Pregunta
        name: pregunta
        widget: string
        hint: Es el título grande (H1) de la página de la respuesta; se muestra completa.
      - label: Dirección (slug)
        name: slug
        widget: string
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Solo minúsculas sin tildes, números y guiones. Ej.: promociones-whatsapp"]
        hint: "La página será vipleconsultores.com/preguntas/<slug>/. No la cambies después de publicar (los enlaces compartidos dejarían de funcionar)."
      - label: Servicio asociado
        name: servicio_asociado
        widget: select
        options:
          - { label: Estructuramos tu negocio, value: estructura-empresarial }
          - { label: Constitución de asociaciones, value: constitucion-asociaciones }
          - { label: Protegemos tu inversión, value: protegemos-tu-inversion }
          - { label: Contratos que funcionan en la práctica, value: contratos }
          - { label: Protección de datos personales, value: proteccion-de-datos }
          - { label: Prácticas comerciales y reclamos, value: reclamos-y-denuncias }
          - { label: Diseño de herramientas legales, value: herramientas-legales }
      - label: Respuesta
        name: respuesta
        widget: markdown
        required: false
        hint: Párrafos, listas y enlaces. Puedes pegar desde Word y revisar el formato con la barra. Obligatoria para publicar.
      - label: Título SEO (pestaña del navegador y Google)
        name: title
        widget: string
        required: false
        hint: "Idealmente hasta unos 60 caracteres. Si no termina en «| Viple Consultores», se agrega solo. Obligatorio para publicar."
      - label: Descripción SEO (meta description)
        name: meta_description
        widget: text
        required: false
        hint: Idealmente hasta unos 155 caracteres; resume la respuesta. Obligatoria para publicar.
      - label: Publicada
        name: publicada
        widget: boolean
        default: false
        required: false
        hint: Márcala solo cuando la respuesta y los datos SEO estén completos. Si falta algo, la web no la muestra aunque esté marcada.
      - label: Destacada en la portada
        name: destacada
        widget: boolean
        default: false
        required: false
        hint: La portada muestra hasta 5 preguntas que estén destacadas Y publicadas. Destacar no publica.
      - label: Orden dentro del servicio
        name: orden
        widget: number
        value_type: int
        default: 10
        required: false
        hint: Las preguntas de cada servicio se muestran de menor a mayor.
      - label: Orden en la portada
        name: orden_portada
        widget: number
        value_type: int
        required: false
        hint: Solo para destacadas. De menor a mayor (1 = primera).
      - label: Fecha de actualización
        name: fecha_actualizacion
        widget: datetime
        date_format: DD/MM/YYYY
        time_format: false
        format: YYYY-MM-DD
        picker_utc: true
        required: false
        hint: Pon la fecha en que escribiste o cambiaste de verdad la respuesta. Se muestra en la página y se usa en el sitemap. Obligatoria para publicar.

  # ---------------- ¿TU EQUIPO ODIA A LEGAL? (notas) ----------------
  # (los archivos se guardan en content/notas y se publican en /gestion-legal/)
  - name: notas
    label: ¿Tu equipo odia a Legal?
    label_singular: Artículo
    description: Artículos sobre cómo organizar y mejorar el trabajo legal en una empresa. Se muestran en «¿Tu equipo odia a Legal?» del menú (/gestion-legal/).
    folder: content/notas
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "gestion-legal/{{slug}}"
    summary: "{{title}} · {{category}} · {{date}}"
    sortable_fields: [date, title, category]
    view_filters:
      - label: Borradores
        field: draft
        pattern: true
      - label: Destacado
        field: featured
        pattern: true
    view_groups:
      - label: Categoría
        field: category
    fields:
      - { label: Título, name: title, widget: string }
      - label: Fecha
        name: date
        widget: datetime
        date_format: DD/MM/YYYY
        time_format: false
        format: YYYY-MM-DD
        picker_utc: true
        required: false
        hint: Si la dejas vacía, se usa la fecha en que creaste la entrada.
      - { label: Autor, name: author, widget: string, default: Gabriel Villavicencio Bedoya }
      - label: Categoría
        name: category
        widget: select
        default: Legal Ops
        options:
          - Legal Ops
          - Inteligencia artificial
          - Legal Design
          - Mejora de procesos
          - Gestión del conocimiento
          - Trabajo legal y empresa
      - label: Resumen
        name: summary
        widget: text
        hint: Una o dos líneas. Aparece en la tarjeta del listado y al compartir en redes.
      - label: Artículo destacado
        name: featured
        widget: boolean
        default: false
        required: false
        hint: Se muestra en grande al inicio del listado. Si marcas varios, se destaca el más reciente; si no marcas ninguno, se destaca el último publicado.
      - label: Imagen principal
        name: image
        widget: image
        required: false
        hint: Opcional. Recomendado horizontal (por ejemplo 1600 × 900 px). Evita imágenes de stock genéricas.
      - label: Descripción de la imagen
        name: image_alt
        widget: string
        required: false
        hint: Texto alternativo para accesibilidad (qué muestra la imagen).
      - { label: Cuerpo del texto, name: body, widget: markdown }
      - label: Fuentes
        name: sources
        widget: list
        required: false
        summary: "{{fields.title}}"
        hint: Opcional. Enlaces a normas, estudios o artículos citados.
        fields:
          - { label: Nombre de la fuente, name: title, widget: string }
          - { label: Enlace (https://…), name: url, widget: string, required: false }
      - label: Borrador (no publicar todavía)
        name: draft
        widget: boolean
        default: false
        required: false

  # ---------------- PRESENTACIONES ESPECIALES ----------------
  # (content/presentaciones; cada una se publica en /presentaciones/<slug>/)
  - name: presentaciones
    label: Presentaciones especiales
    label_singular: Presentación
    description: "Presentaciones mostradas como diapositivas en imagen dentro de la web (no se ofrece ningún archivo para descargar). Exporta las diapositivas como JPG y súbelas en orden. IMPORTANTE: antes de subirlas, ponles nombres propios de cada presentación (p. ej. inmobiliarias-01.jpg, inmobiliarias-02.jpg…); si dos presentaciones usan «1.jpg», una reemplaza las imágenes de la otra."
    folder: content/presentaciones
    create: true
    delete: true
    extension: json
    format: json
    identifier_field: title
    slug: "{{fields.slug}}"
    media_folder: /assets/uploads/presentaciones
    public_folder: /assets/uploads/presentaciones
    preview_path: "presentaciones/{{slug}}"
    summary: "{{title}} · {{categoria}} · {{date}}"
    sortable_fields: [date, title]
    view_filters:
      - label: Borradores
        field: draft
        pattern: true
    view_groups:
      - label: Categoría
        field: categoria
    fields:
      - label: Título visible (H1)
        name: title
        widget: string
        hint: Título grande de la página de la presentación y de su tarjeta en el catálogo.
      - label: Dirección (slug)
        name: slug
        widget: viple-texto
        desde: title
        modo: slug
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Solo minúsculas sin tildes, números y guiones. Ej.: datos-personales-inmobiliarias"]
        hint: "La página será vipleconsultores.com/presentaciones/<slug>/. Se propone sola a partir del título mientras la presentación es nueva; puedes acortarla. Después de guardar ya no cambia aunque modifiques el título. No la cambies después de publicar."
      - label: Categoría (servicio)
        name: categoria
        widget: select
        required: false
        options:
          - { label: Estructuramos tu negocio, value: estructura-empresarial }
          - { label: Asociaciones, value: constitucion-asociaciones }
          - { label: Protegemos tu inversión, value: protegemos-tu-inversion }
          - { label: Contratos que funcionan en la práctica, value: contratos }
          - { label: Protección de datos personales, value: proteccion-de-datos }
          - { label: Prácticas comerciales y reclamos, value: reclamos-y-denuncias }
          - { label: Diseño de herramientas legales, value: herramientas-legales }
        hint: Servicio con el que se relaciona. Sirve para los filtros del catálogo. Si la dejas vacía, la presentación aparece solo en «Todas».
      - label: Resumen (tarjeta y encabezado)
        name: summary
        widget: text
        hint: Presenta la presentación en pocas líneas. Se ve en la tarjeta del catálogo y debajo del título, en la franja azul. Si no completas la metadescripción, su inicio se usa para Google.
      - label: Diapositivas
        name: slides
        widget: list
        required: false
        collapsed: true
        add_to_top: false
        label_singular: diapositiva
        hint: "Una imagen por diapositiva, en orden (JPG de unos 1600 px de ancho y menos de 300 KB). Usa nombres de archivo propios de esta presentación (p. ej. inmobiliarias-01.jpg). Puedes reordenarlas arrastrándolas."
        field: { label: Imagen de la diapositiva, name: image, widget: image, choose_url: false }
      - label: Contenido de la presentación en texto (debajo de las diapositivas, ayuda a Google)
        name: body
        widget: markdown
        required: false
        hint: Opcional, pero recomendado. Google no lee el texto dentro de las imágenes. Escribe aquí los puntos principales de las diapositivas (unas 150–300 palabras); no repitas el resumen. Se ve solo en la página de la presentación, debajo del visor.
      - label: O enlace a la presentación en otro sitio
        name: link
        widget: string
        required: false
        hint: Opcional. Solo si la presentación está publicada fuera de la web (por ejemplo, Canva). Si subiste diapositivas, se usan las diapositivas.
      - label: Imagen de portada
        name: image
        widget: image
        required: false
        choose_url: false
        hint: Opcional. Aparece en el catálogo (se ve completa, en formato 16:9). Si la dejas vacía, se usa la primera diapositiva.
      - label: Título SEO (pestaña del navegador y Google)
        name: title_seo
        widget: viple-texto
        desde: title
        modo: texto
        recomendado: [50, 60]
        sufijo: " | Viple Consultores"
        required: false
        hint: "Se propone igual al título visible mientras la presentación es nueva; edítalo libremente (uno no cambia al otro). Si no termina en «| Viple Consultores», se agrega solo. Si lo dejas vacío, se usa el título visible."
      - label: Metadescripción (Google)
        name: meta_description
        widget: viple-texto
        multilinea: true
        recomendado: [140, 160]
        required: false
        hint: Resumen breve para Google. Si la dejas vacía, se usa el inicio del resumen.
      - label: Fecha
        name: date
        widget: datetime
        date_format: DD/MM/YYYY
        time_format: false
        format: YYYY-MM-DD
        picker_utc: true
        default: "{{now}}"
        required: false
        hint: Fecha de publicación (se completa con la de hoy); las más recientes aparecen primero.
      - label: Borrador (no publicar todavía)
        name: draft
        widget: boolean
        default: false
        required: false

  # ---------------- NOVEDADES ----------------
  - name: novedades
    label: Novedades
    label_singular: Novedad
    description: Nuevas normas, cambios regulatorios y asuntos de interés. Se muestran en «Novedades» del menú (/novedades/).
    folder: content/novedades
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "novedades/{{slug}}"
    summary: "{{title}} · {{category}} · {{date}}"
    sortable_fields: [date, title, category]
    view_filters:
      - label: Borradores
        field: draft
        pattern: true
    view_groups:
      - label: Categoría
        field: category
    fields:
      - { label: Título, name: title, widget: string }
      - label: Fecha
        name: date
        widget: datetime
        date_format: DD/MM/YYYY
        time_format: false
        format: YYYY-MM-DD
        picker_utc: true
        required: false
        hint: Si la dejas vacía, se usa la fecha en que creaste la entrada.
      - { label: Autor, name: author, widget: string, default: Gabriel Villavicencio Bedoya }
      - label: Categoría
        name: category
        widget: select
        default: Nueva norma
        options:
          - Nueva norma
          - Modificación normativa
          - Proyecto de ley
          - Resolución o criterio de autoridad
          - Asunto de interés
      - label: Resumen
        name: summary
        widget: text
        hint: Una o dos líneas. Aparece en la tarjeta del listado y al compartir en redes.
      - label: Nombre de la fuente
        name: source_name
        widget: string
        required: false
        hint: Opcional. Ej. Diario Oficial El Peruano
      - label: Enlace a la norma o fuente
        name: source_url
        widget: string
        required: false
        hint: Opcional. Dirección web completa (https://…)
      - label: Imagen principal
        name: image
        widget: image
        required: false
        hint: Opcional. Recomendado horizontal (por ejemplo 1600 × 900 px).
      - label: Descripción de la imagen
        name: image_alt
        widget: string
        required: false
      - { label: Cuerpo del texto, name: body, widget: markdown }
      - label: Borrador (no publicar todavía)
        name: draft
        widget: boolean
        default: false
        required: false
