# Netlify: cómo construir y publicar el sitio
[build]
  command = "pip install -r requirements.txt && python3 build.py"
  publish = "_site"

# El panel de administración no debe aparecer en buscadores
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# La dirección técnica de Netlify redirige al dominio oficial (evita contenido duplicado en buscadores).
# Solo afecta a esa dirección exacta; las vistas previas (rama--...netlify.app) siguen funcionando.
[[redirects]]
  from = "https://resplendent-sfogliatella-e4a742.netlify.app/*"
  to = "https://vipleconsultores.com/:splat"
  status = 301
  force = true

# Novedades y Quién soy pasaron a bloques de la portada (11 nov 2026). Destino con ancla (#).
# Sin comodín: las páginas de cada novedad (/novedades/<slug>/) se conservan.
[[redirects]]
  from = "/novedades"
  to = "/#novedades"
  status = 301
[[redirects]]
  from = "/novedades/"
  to = "/#novedades"
  status = 301
[[redirects]]
  from = "/quien-soy"
  to = "/#quien-soy"
  status = 301
[[redirects]]
  from = "/quien-soy/"
  to = "/#quien-soy"
  status = 301
